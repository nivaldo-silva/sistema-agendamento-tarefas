server:
  port: 8083

spring:
  application:
    name: agendador-tarefas
  output:
    ansi:
      enabled: ALWAYS
  data:
    mongodb:
      uri: mongodb://localhost:27017/agendador_tarefas
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/.well-known/jwks.json

microservices:
  notificacao-email:
    url: http://localhost:8084


cron:
  horario: 0 * * * * *
  timezone: America/Sao_Paulo

logging:
  pattern:
    console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n'
  level:
    root: INFO
    io.github.nivaldosilva: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
